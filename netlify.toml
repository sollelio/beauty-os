# Beauty OS production frontend (Netlify). Environment values (public only) live in Netlify, never in Git:
# VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY, VITE_TURNSTILE_SITE_KEY. See docs/operations/production-checkpoint.md.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every route is served by index.html (direct loads and refreshes of /privado/..., /stock, ...).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
